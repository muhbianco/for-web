<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Idle Hunt · laboratório</title>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { background: #0d0c0b; color: #f3efe6; font: 15px/1.4 system-ui, sans-serif; }
      .lab { display: grid; grid-template-columns: 220px 1fr; height: 100%; }
      .lab > nav { padding: 12px; overflow: auto; border-right: 1px solid #3a2f20; display: flex; flex-direction: column; gap: 8px; }
      .lab > nav select { display: none; min-height: 40px; background: #1c1814; color: inherit; border: 1px solid #7a6440; border-radius: 8px; }
      .lab > nav ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
      .lab > nav a { color: #c4b8a2; text-decoration: none; padding: 4px 6px; border-radius: 6px; display: block; }
      .lab > nav a[aria-current=page] { background: #4a3a1c; color: #ffe7a8; }
      .map { position: relative; overflow: hidden;
        background-color: #2b3326;
        background-image: linear-gradient(rgba(0,0,0,.18) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,.18) 1px, transparent 1px);
        background-size: 32px 32px; }
      .chips { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 8px; z-index: 2; }
      .reopen { min-height: 32px; border-radius: 999px; border: 1px solid #7a6440; background: #1c1814; color: inherit; padding: 0 12px; }
      .notice { position: absolute; bottom: 10px; left: 10px; background: #1c1814; padding: 8px 12px; border-radius: 8px; }
      @media (max-width: 700px) {
        .lab { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
        .lab > nav { border-right: none; border-bottom: 1px solid #3a2f20; padding: 6px 10px; flex-direction: row; align-items: center; }
        .lab > nav ul { display: none; }
        .lab > nav select { display: block; flex: 1; }
        .lab > nav strong { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./lab.tsx"></script>
  </body>
</html>
