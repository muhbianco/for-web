<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Refúgio — página de dev</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101117;
        --panel: #181a23;
        --line: #2a2d3a;
        --text: #e9e9ef;
        --muted: #9a9db0;
        --accent: #6aa7ff;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
      .app { display: grid; grid-template-columns: minmax(0, 1fr) 420px; height: 100vh; }
      #space { min-width: 0; min-height: 0; outline: none; }
      aside { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
      #scene { height: 280px; flex: none; border-bottom: 1px solid var(--line); }
      .body { padding: 10px 12px; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
      .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      button, select { background: #252836; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; font: inherit; cursor: pointer; }
      button:hover { border-color: var(--accent); }
      button:disabled { opacity: 0.45; cursor: default; }
      h2 { margin: 0; font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
      .muted { color: var(--muted); }
      .bar { height: 6px; background: #2a2d3a; border-radius: 3px; overflow: hidden; }
      .bar > i { display: block; height: 100%; background: #4dd26a; }
      #log { font: 11px/1.35 ui-monospace, monospace; color: var(--muted); white-space: pre-wrap; max-height: 160px; overflow: auto; border-top: 1px solid var(--line); padding-top: 6px; }
      .err { color: #ff8a7a; }
    </style>
  </head>
  <body>
    <div class="app">
      <div id="space" tabindex="0" aria-label="Mapa do espaço"></div>
      <aside>
        <div id="scene" aria-hidden="true"></div>
        <div class="body">
          <div class="row"><strong>Refúgio</strong><span class="muted">como <span id="who"></span> · quadros desenhados: <span id="frames">0</span></span></div>
          <div id="hero" class="muted">Carregando…</div>
          <div id="create" class="row"></div>
          <h2>Expedição</h2>
          <div class="row">
            <select id="degree" aria-label="Degrau">
              <option value="normal">Normal</option>
              <option value="dificil">Difícil</option>
              <option value="pesadelo">Pesadelo</option>
              <option value="abismo">Abismo 1</option>
            </select>
            <button id="start">Partir</button>
            <button id="abandon">Abandonar</button>
            <span class="muted">velocidade</span>
            <button data-speed="1">1×</button><button data-speed="2">2×</button><button data-speed="4">4×</button>
            <button id="skip">Pular</button>
          </div>
          <div id="run" class="muted"></div>
          <div id="choices" class="row"></div>
          <h2>Teste</h2>
          <div class="row">
            <button id="stress">Abrir e fechar a cena 20×</button>
            <span id="stressOut" class="muted"></span>
          </div>
          <div id="log" aria-live="polite"></div>
        </div>
      </aside>
    </div>
    <script type="module" src="./game.ts"></script>
  </body>
</html>
