# Push no main = deploy do web do Muchat (chat.muhbianco.com.br). Imagem LOCAL no host
# (muchat-web:<sha12> + :latest; compose usa pull_policy: never) → `docker compose -p stoat up web`
# em /usr/src/stoat. Rollback: `docker tag muchat-web:<sha anterior> muchat-web:latest` e o mesmo up.
when:
  - event: push
    branch: main

depends_on: [ci]

clone:
  git:
    image: woodpeckerci/plugin-git:2.10.1
    settings:
      recursive: false
      depth: 50
      partial: false

steps:
  build:
    image: muhrilobianco/ci-deployer:1
    pull: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - git submodule update --init --depth 1 packages/stoat.js packages/solid-livekit-components
      - hel1-build --image muchat-web --tag ${CI_COMMIT_SHA:0:12} --extra-tag latest --local

  deploy:
    image: muhrilobianco/ci-deployer:1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/hel1-deploy:/var/lib/hel1-deploy
      - /usr/src/stoat:/usr/src/stoat:ro
    commands:
      - >-
        hel1-deploy exec --app muchat-web --tag ${CI_COMMIT_SHA:0:12}
        --smoke https://chat.muhbianco.com.br/login
        -- sh -ec 'cd /usr/src/stoat && docker compose -p stoat up -d --no-deps web'

  # Muchat Espaço: servidor do espaço (packages/space-server). Imagem LOCAL muchat-space:<sha12>
  # + :latest, como o web. Só sobe quando o overlay já tem o serviço ligado (COMPOSE_PROFILES
  # com `space` no .env de /usr/src/stoat); antes disso a imagem fica pronta e nada muda.
  # Rollback: `docker tag muchat-space:<sha anterior> muchat-space:latest` e o mesmo up.
  space-build:
    image: muhrilobianco/ci-deployer:1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    when:
      - path:
          include: ["packages/space-core/**", "packages/space-server/**", "pnpm-lock.yaml", ".woodpecker/deploy.yaml"]
    commands:
      - >-
        hel1-build --image muchat-space --tag ${CI_COMMIT_SHA:0:12} --extra-tag latest --local
        --file packages/space-server/Dockerfile

  space-deploy:
    image: muhrilobianco/ci-deployer:1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/hel1-deploy:/var/lib/hel1-deploy
      - /usr/src/stoat:/usr/src/stoat:ro
    when:
      - path:
          include: ["packages/space-core/**", "packages/space-server/**", "pnpm-lock.yaml", ".woodpecker/deploy.yaml"]
    commands:
      # hel1-deploy confere o commit no clone do CI: rode-o no workspace, nunca depois de um
      # `cd /usr/src/stoat` (a pasta do overlay não tem o histórico do for-web).
      - |
        if ! (cd /usr/src/stoat && docker compose -p stoat config --services) | grep -qx space; then
          echo "space: serviço ainda desligado no overlay (COMPOSE_PROFILES); imagem pronta, nada a subir"
          exit 0
        fi
        hel1-deploy exec --app muchat-space --tag ${CI_COMMIT_SHA:0:12} \
          --smoke https://chat.muhbianco.com.br/_muchat/space/health/live \
          -- sh -ec 'cd /usr/src/stoat && docker compose -p stoat up -d --no-deps space'
