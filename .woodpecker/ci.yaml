# CI do fork do cliente web do Muchat. O portão é o build da imagem (pnpm install frozen, build dos
# pacotes, lingui, vite) no deploy.yaml; aqui: deps + eslint (portão) e tsc (relatório).
# Os workflows herdados do upstream em .github/ ficam desligados no GitHub (Settings → Actions).
when:
  - branch: main
    event: [push, pull_request, manual]

clone:
  git:
    image: woodpeckerci/plugin-git:2.10.1
    settings:
      recursive: false

steps:
  submodules:
    image: muhrilobianco/ci-deployer:1
    pull: true
    commands:
      # packages/client/assets fica de fora (update = none, host interno do upstream).
      - git submodule update --init --depth 1 packages/stoat.js packages/solid-livekit-components

  # Regra zero da voz (docs/espaco ADR 0009 no overlay muchat): num pull request, a cadeia de áudio
  # só muda em branch voz/*. No push direto na main não roda: o trabalho de voz entra por ali, e um
  # portão que errasse travaria o deploy. As pastas do jogo têm ainda o ESLint e a varredura do
  # space-core (testing/voiceGuard.ts), que rodam em todo push.
  audio-guard:
    image: muhrilobianco/ci-deployer:1
    depends_on: [submodules]
    when:
      - event: pull_request
    commands:
      - |
        case "$CI_COMMIT_SOURCE_BRANCH" in
          voz/*) echo "branch de voz: a cadeia de áudio pode mudar aqui"; exit 0 ;;
        esac
      - git fetch --unshallow --quiet || true
      - git fetch --no-tags --quiet origin "+refs/heads/$CI_COMMIT_TARGET_BRANCH:refs/remotes/origin/$CI_COMMIT_TARGET_BRANCH"
      - bash packages/client/qa/voice-lab/tools/protected-diff.sh "origin/$CI_COMMIT_TARGET_BRANCH"

  deps:
    image: node:24-alpine
    depends_on: [submodules]
    commands:
      - apk add --no-cache git python3 make g++ patch >/dev/null
      - corepack enable
      - grep -q 'voiceCallUpdate' packages/stoat.js/src/Client.ts || patch -p1 -d packages/stoat.js < docker/overlays/stoat.js-voice.patch
      - pnpm install --frozen-lockfile
      - pnpm --filter stoat.js build
      - pnpm --filter solid-livekit-components build
      - pnpm --filter client exec lingui compile --typescript
      - pnpm --filter client exec node scripts/copyAssets.mjs
      - pnpm --filter client exec panda codegen

  lint:
    image: node:24-alpine
    depends_on: [deps]
    commands:
      - corepack enable
      - pnpm exec eslint --ext .ts,.tsx packages/client

  # Muchat Espaço: regras compartilhadas e núcleo de mídia (docs/espaco no overlay muchat).
  space:
    image: node:24-alpine
    depends_on: [deps]
    commands:
      - corepack enable
      - pnpm --filter @muchat/space-core test
      - pnpm --filter @muchat/space-core typecheck
      - pnpm --filter @muchat/space-server test
      - pnpm --filter @muchat/space-server typecheck
      - pnpm --filter @muchat/space-client test
      - pnpm --filter @muchat/space-client typecheck

  # O main ainda não passa no tsc (22 erros, parte herdada do upstream): relatório até zerar.
  typecheck:
    image: node:24-alpine
    depends_on: [deps]
    failure: ignore
    commands:
      - corepack enable
      - pnpm --filter client exec tsc --noEmit
